# WA Broadcaster (wa.marketian.net): PostgreSQL, Redis, Django API, Celery worker + beat,
# the WhatsApp gateway and Nginx serving the React UI.
# Started from the repo root (../../docker-compose.yml includes this file):
#   docker compose up -d --build wa wa-backend wa-worker wa-beat wa-gateway
#   docker compose --profile evolution up -d wa-evolution   (only with WA_PROVIDER=evolution)
# The proxy reaches the UI as "wa:80" on the shared "web-proxy" network; nothing else
# is reachable from outside. Names start with "wa" so they never clash with other sites.

x-backend: &backend
  build: ./backend
  image: wa-backend
  env_file: .env
  environment:
    DATABASE_URL: postgres://wab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in sites/wa/.env}@wa-db:5432/wab
    REDIS_URL: redis://wa-redis:6379/0
    GATEWAY_URL: http://wa-gateway:3100
    EVOLUTION_URL: http://wa-evolution:8080
    WEBHOOK_URL: http://wa-backend:8000/api/whatsapp/webhook/
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-wa.marketian.net},wa-backend,127.0.0.1,localhost
    # Caddy (proxy) + the UI's Nginx sit in front of Django.
    NUM_PROXIES: "2"
    MEDIA_ROOT: /app/media
    STATIC_ROOT: /app/staticfiles
  volumes:
    - wa-media:/app/media
  depends_on:
    wa-db: { condition: service_healthy }
    wa-redis: { condition: service_healthy }
  networks:
    - wa-private
    - wa-data
  restart: unless-stopped

services:
  # The web UI (Nginx + the built React app); forwards /api, /admin, /accounts and /m to Django.
  wa:
    build: ./frontend
    image: wa-web
    volumes:
      - wa-static:/usr/share/nginx/static:ro
    depends_on:
      wa-backend: { condition: service_healthy }
    networks:
      - wa-private
      - web-proxy
    restart: unless-stopped

  wa-backend:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput -v0 &&
             python manage.py ensure_admin &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -"
    volumes:
      - wa-media:/app/media
      - wa-static:/app/staticfiles
    networks:
      - wa-private
      - wa-data
      # Signing in talks to accounts.marketian.net, which the proxy answers on this network.
      - web-proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  wa-worker:
    <<: *backend
    # Sends campaigns. Each workspace sends one campaign at a time by design.
    command: celery -A config worker --loglevel=info --concurrency=4
    depends_on:
      wa-backend: { condition: service_healthy }  # migrations done
      wa-redis: { condition: service_healthy }

  wa-beat:
    <<: *backend
    # Starts due / scheduled campaigns every few seconds.
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes: []
    depends_on:
      wa-backend: { condition: service_healthy }
      wa-redis: { condition: service_healthy }

  # Holds the WhatsApp connections. Needs the internet (WhatsApp's servers), never reachable from it.
  wa-gateway:
    build: ./gateway
    image: wa-gateway
    env_file: .env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_WEBHOOK_URL: http://wa-backend:8000/api/whatsapp/webhook/
      SESSIONS_DIR: /app/sessions
    volumes:
      # WhatsApp logins: full access to the linked numbers. Backed up by scripts/backup.sh.
      - wa-sessions:/app/sessions
    networks:
      - wa-private
    restart: unless-stopped

  wa-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wab
      POSTGRES_USER: wab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in sites/wa/.env}
    volumes:
      - wa-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wab -d wab"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wa-data
    restart: unless-stopped

  wa-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - wa-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wa-data
    restart: unless-stopped

  wa-evolution:
    profiles: ["evolution"]
    image: atendai/evolution-api:v2.2.3
    environment:
      SERVER_URL: http://wa-evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://wab:${POSTGRES_PASSWORD}@wa-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://wa-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - wa-evolution-instances:/evolution/instances
    depends_on:
      wa-db: { condition: service_healthy }
      wa-redis: { condition: service_healthy }
    networks:
      - wa-private
      - wa-data
    restart: unless-stopped

volumes:
  wa-pgdata:
  wa-redisdata:
  wa-media:
  wa-static:
  wa-sessions:
  wa-evolution-instances:

networks:
  # The app's own services. Has internet access (WhatsApp, links to attach) but no other site joins it.
  wa-private:
  # Database and Redis only: no internet at all.
  wa-data:
    internal: true
  # Shared with the proxy.
  web-proxy:
    name: web-proxy
