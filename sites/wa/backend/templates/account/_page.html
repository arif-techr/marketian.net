<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · WA Broadcaster</title>
  <style>
    :root { color-scheme: light; --bg: #eef1f6; --panel: #ffffff; --text: #172033; --muted: #5b6578; --brand: #2f5bd3; --brand-ink: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #0f141d; --panel: #182030; --text: #e6ebf3; --muted: #98a3b6; --brand: #7d9cff; --brand-ink: #0f141d; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; background: var(--panel); border-radius: 14px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: var(--muted); }
    a.btn { display: inline-block; background: var(--brand); color: var(--brand-ink); padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
