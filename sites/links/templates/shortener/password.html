{% extends "base.html" %}
{% block title %}Password needed · {{ product_name }}{% endblock %}
{% block content %}
<form class="auth card" method="post" hx-boost="false">
  {% csrf_token %}
  <h1>This link needs a password</h1>
  <p class="muted">Ask the person who shared it for the password.</p>
  {% if error %}<ul class="errorlist"><li>{{ error }}</li></ul>{% endif %}
  <p><label for="link-password">Password</label><input id="link-password" type="password" name="password" autocomplete="off" required autofocus></p>
  <button type="submit">Continue</button>
</form>
{% endblock %}
