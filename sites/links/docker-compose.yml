# links.marketian.net: the Marketian link shortener.
# Signs people in through accounts.marketian.net; its database lives on the
# shared PostgreSQL server in ../../infra (created with: scripts/create-db.sh links).

services:
  links:
    build: .
    image: links-web
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      # Bio page photos. Backed up by scripts/backup.sh.
      - links-media:/app/media
    networks:
      - shared-db
      - web-proxy

volumes:
  links-media:

networks:
  shared-db:
    name: shared-db
    internal: true
  web-proxy:
    name: web-proxy
