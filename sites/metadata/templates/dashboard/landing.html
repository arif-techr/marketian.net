{% extends "base.html" %}
{% block content %}
<section style="text-align:center;max-width:640px;margin:48px auto">
  <h1 style="font-size:clamp(2rem,6vw,3rem)">{{ product_name }}</h1>
  <p class="muted" style="font-size:1.15rem">{{ product_tagline }}</p>
  <p style="margin-top:28px">
    {% if user.is_authenticated %}
      <a class="btn btn-inline" href="{% url 'dashboard:app' %}">Open dashboard</a>
    {% else %}
      <a class="btn btn-inline" href="{% url 'dashboard:login' %}">Get started free</a>
    {% endif %}
  </p>
  <p class="small muted">Sign in with your Marketian account: GitHub or email.</p>
</section>
{% endblock %}
