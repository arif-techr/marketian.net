# Everything that runs on the Marketian VPS, started with one command:
#
#   docker compose up -d --build            start / update all sites
#   docker compose up -d --build marketian  update one site
#   docker compose ps                       see what's running
#   docker compose logs -f marketian        follow one site's logs
#
# Adding a site: create sites/<name> from sites/_template, add it below,
# and add its domain to proxy/Caddyfile.

name: marketian-net

include:
  - proxy/docker-compose.yml
  - infra/docker-compose.yml          # shared PostgreSQL for the SaaS products
  - sites/marketian/docker-compose.yml
  - sites/accounts/docker-compose.yml # accounts.marketian.net: one login for every product
  - sites/metadata/docker-compose.yml
  # - sites/qr/docker-compose.yml
